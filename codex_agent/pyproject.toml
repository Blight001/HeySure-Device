[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heysure-codex-agent"
version = "0.1.0"
description = "HeySure Codex App Server maintenance device"
requires-python = ">=3.10"
dependencies = [
  "python-socketio[client]>=5.11,<6",
  "requests>=2.31,<3",
]

[project.scripts]
heysure-codex-agent = "codex_agent.main:main"

[tool.setuptools]
packages = ["codex_agent"]

